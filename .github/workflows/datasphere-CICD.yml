name: Datasphere CI/CD - Export -> PR -> QA -> Test -> PROD

# ---------------------------------------------------------------------------
# ONE file, TWO paths, gated by which event fired:
#
#   workflow_dispatch : export object(s) from a source space, commit to a
#                       branch, open a PR against main. Run ends here -
#                       review/edit the JSON in the PR, then merge it.
#
#   push to main       : fires when that PR (or any objects/** change) is
#                       merged. Resolves the changed objects and promotes:
#                       QA (approval) -> test -> plan -> PROD (approval).
#
# Nothing reaches QA or PROD without a human merging a PR first, and nothing
# reaches PROD without two separate environment approvals.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      source_space:
        description: "Source space ID to export from (usually DEV)"
        required: true
      object_type:
        description: "Object type"
        required: true
        type: choice
        default: "local-tables"
        options:
          - local-tables
          - views
          - analytic-models
          - data-flows
          - transformation-flows
          - replication-flows
          - data-access-controls
          - task-chains
          - intelligent-lookups
      technical_name:
        description: "Technical name, or comma-separated list"
        required: true
  push:
    branches: [main]
    paths:
      - "objects/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: datasphere-cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  DSP_HOST: ${{ vars.DSP_HOST }}

jobs:
  # =========================================================================
  # PATH A - manual dispatch only: export and raise a PR. Run ends here.
  # =========================================================================
  export_and_pr:
    name: A1. Export -> open PR
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPACE: ${{ inputs.source_space }}
      TYPE: ${{ inputs.object_type }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install -g @sap/datasphere-cli

      - name: Log in to Datasphere
        env:
          DSP_CLIENT_ID: ${{ secrets.DSP_GIT_INTEGRATE_CLIENT_ID }}
          DSP_CLIENT_SECRET: ${{ secrets.DSP_GIT_INTEGRATE_CLIENT_SECRET }}
          DSP_AUTH_URL: ${{ secrets.DSP_AUTH_URL }}
          DSP_TOKEN_URL: ${{ secrets.DSP_TOKEN_URL }}
        run: |
          set +e
          datasphere login --host "$DSP_HOST" \
            --client-id "$DSP_CLIENT_ID" --client-secret "$DSP_CLIENT_SECRET" \
            --authorization-url "$DSP_AUTH_URL" --token-url "$DSP_TOKEN_URL" \
            --authorization-flow client_credentials
          LOGIN_EXIT=$?
          set -e
          if [ $LOGIN_EXIT -ne 0 ]; then
            echo "::error::datasphere login exited $LOGIN_EXIT - check DSP_HOST, DSP_AUTH_URL, DSP_TOKEN_URL, and that the OAuth client uses the client_credentials flow."
            exit 1
          fi
          echo "Login succeeded."

      - name: List objects of this type in the space (pre-flight check)
        run: |
          echo "Objects of type '$TYPE' visible in space '$SPACE':"
          set +e
          datasphere objects "$TYPE" list --host "$DSP_HOST" --space "$SPACE" > /tmp/list.json 2> /tmp/list_err.log
          LIST_EXIT=$?
          set -e
          if [ $LIST_EXIT -ne 0 ]; then
            echo "::error::Could not list $TYPE objects in space '$SPACE'. This usually means the space ID is wrong or the technical user lacks access to it. stderr:"
            cat /tmp/list_err.log
            exit 1
          fi
          cat /tmp/list.json
          echo "--- If your target name isn't spelled exactly the same (case-sensitive) above, that's the cause of the next step failing. ---"

      - name: Export each requested object
        run: |
          mkdir -p "objects/$TYPE" objects/.provenance
          IFS=',' read -ra NAMES <<< "${{ inputs.technical_name }}"
          for RAW in "${NAMES[@]}"; do
            NAME=$(echo "$RAW" | xargs)
            [ -z "$NAME" ] && continue
            FILE="objects/$TYPE/$NAME.json"

            if ! grep -qi "\"$NAME\"" /tmp/list.json; then
              echo "::warning::'$NAME' was not found (case-insensitive match) in the object list printed above. Proceeding anyway in case the list output format differs, but this will likely fail."
            fi

            set +e
            datasphere objects "$TYPE" read --host "$DSP_HOST" --space "$SPACE" \
              --technical-name "$NAME" > /tmp/cli_out.log 2> /tmp/cli_err.log
            CLI_EXIT=$?
            set -e
            cp /tmp/cli_out.log "$FILE"

            if [ $CLI_EXIT -ne 0 ]; then
              echo "::error::CLI exited $CLI_EXIT reading $TYPE/$NAME."
              echo "--- stdout ---"
              cat /tmp/cli_out.log
              echo "--- stderr ---"
              cat /tmp/cli_err.log
              exit 1
            fi
            if [ ! -s "$FILE" ]; then
              echo "::error::$FILE is empty for $TYPE/$NAME in space $SPACE. Check the technical name is exact (case-sensitive) and that the object is exposed for consumption."
              echo "--- stderr, if any ---"
              cat /tmp/cli_err.log
              exit 1
            fi
            if ! jq empty "$FILE" 2>/dev/null; then
              echo "::error::$FILE is not valid JSON - the CLI likely wrote an error message instead of the object. Contents:"
              cat "$FILE"
              exit 1
            fi
            jq --sort-keys . "$FILE" > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"

            jq -n --arg space "$SPACE" --arg type "$TYPE" --arg name "$NAME" \
              --arg run "${{ github.run_id }}" --arg actor "${{ github.actor }}" \
              --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{source_space:$space,object_type:$type,technical_name:$name,run_id:$run,exported_by:$actor,exported_at:$at}' \
              > "objects/.provenance/${TYPE}__${NAME}.json"

            echo "Exported $TYPE/$NAME ($(wc -c < "$FILE") bytes)"
          done

      - name: Stop if nothing changed
        id: diff
        run: |
          git add objects
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Export matches what is already in Git - no PR needed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit to a branch and open PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SLUG=$(echo "${{ inputs.technical_name }}" | tr -c 'a-zA-Z0-9' '-' | tr -s '-' | sed 's/-$//')
          BRANCH="export/${TYPE}-${SLUG}-${{ github.run_id }}"
          git config user.name "datasphere-ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "Export ${{ inputs.technical_name }} ($TYPE) from $SPACE"
          git push origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Export ${{ inputs.technical_name }} ($TYPE) from $SPACE" \
            --body "Exported by @${{ github.actor }} from \`$SPACE\`.

          Review and edit the JSON as needed. **Merging this PR triggers QA deployment**,
          followed by a test pass, a PROD change plan, then PROD deployment - each
          promotion step needs its own environment approval."

      - name: Summary when nothing to export
        if: steps.diff.outputs.changed == 'false'
        run: echo "Nothing to do - no PR opened."

  # =========================================================================
  # PATH B - triggered by push to main (i.e. the PR above got merged, or
  # anyone else edited objects/** directly and merged). Resolves + promotes.
  # =========================================================================
  resolve:
    name: B1. Resolve merged objects
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      count: ${{ steps.detect.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build ordered matrix of changed objects
        id: detect
        env:
          RANKS: >-
            {"data-access-controls":0,"local-tables":1,"views":2,
             "intelligent-lookups":3,"analytic-models":4,"data-flows":5,
             "transformation-flows":6,"replication-flows":7,"task-chains":8}
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="${{ github.sha }}^"
          fi
          FILES=$(git diff --name-only --diff-filter=ACM "$BEFORE" "${{ github.sha }}" -- objects \
            | grep -E '^objects/[^/]+/.+\.json$' \
            | grep -v '^objects/\.provenance/' || true)

          if [ -z "$FILES" ]; then
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "No deployable object files changed in this merge." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          MATRIX=$(printf '%s\n' "$FILES" | jq -R -s -c --argjson ranks "$RANKS" '
            split("\n") | map(select(length > 0)) |
            map({object_type: (split("/")[1]),
                 technical_name: (split("/")[-1] | sub("\\.json$"; ""))}) |
            map(. + {rank: ($ranks[.object_type] // 9)}) |
            sort_by(.rank) | {include: .}')

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$MATRIX" | jq '.include | length')" >> "$GITHUB_OUTPUT"
          echo "## Objects merged in this push" >> "$GITHUB_STEP_SUMMARY"
          echo "$MATRIX" | jq -r '.include[] | "- `\(.object_type)/\(.technical_name)`"' >> "$GITHUB_STEP_SUMMARY"

  deploy_qa:
    name: B2. QA - ${{ matrix.object_type }}/${{ matrix.technical_name }}
    needs: resolve
    if: needs.resolve.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: qa
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    env:
      SPACE: ${{ vars.QA_SPACE }}
      TYPE: ${{ matrix.object_type }}
      NAME: ${{ matrix.technical_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install -g @sap/datasphere-cli

      - name: Log in to Datasphere
        env:
          DSP_CLIENT_ID: ${{ secrets.DSP_GIT_INTEGRATE_CLIENT_ID }}
          DSP_CLIENT_SECRET: ${{ secrets.DSP_GIT_INTEGRATE_CLIENT_SECRET }}
          DSP_AUTH_URL: ${{ secrets.DSP_AUTH_URL }}
          DSP_TOKEN_URL: ${{ secrets.DSP_TOKEN_URL }}
        run: |
          datasphere login --host "$DSP_HOST" \
            --client-id "$DSP_CLIENT_ID" --client-secret "$DSP_CLIENT_SECRET" \
            --authorization-url "$DSP_AUTH_URL" --token-url "$DSP_TOKEN_URL" \
            --authorization-flow client_credentials

      - name: Create or update in QA
        run: |
          FILE="objects/$TYPE/$NAME.json"
          set +e
          if datasphere objects "$TYPE" read --host "$DSP_HOST" --space "$SPACE" \
               --technical-name "$NAME" > /tmp/current.json 2>/dev/null && [ -s /tmp/current.json ]; then
            datasphere objects "$TYPE" update --host "$DSP_HOST" --space "$SPACE" \
              --technical-name "$NAME" --file-path "$FILE" > /tmp/cli_out.log 2> /tmp/cli_err.log
          else
            datasphere objects "$TYPE" create --host "$DSP_HOST" --space "$SPACE" \
              --technical-name "$NAME" --file-path "$FILE" > /tmp/cli_out.log 2> /tmp/cli_err.log
          fi
          CLI_EXIT=$?
          set -e
          if [ $CLI_EXIT -ne 0 ]; then
            echo "::error::CLI exited $CLI_EXIT deploying $TYPE/$NAME to $SPACE."
            echo "--- stdout ---"
            cat /tmp/cli_out.log
            echo "--- stderr ---"
            cat /tmp/cli_err.log
            exit 1
          fi
          cat /tmp/cli_out.log

  test_qa:
    name: B3. Test in QA
    needs: [resolve, deploy_qa]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPACE: ${{ vars.QA_SPACE }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install -g @sap/datasphere-cli

      - name: Log in to Datasphere
        env:
          DSP_CLIENT_ID: ${{ secrets.DSP_GIT_INTEGRATE_CLIENT_ID }}
          DSP_CLIENT_SECRET: ${{ secrets.DSP_GIT_INTEGRATE_CLIENT_SECRET }}
          DSP_AUTH_URL: ${{ secrets.DSP_AUTH_URL }}
          DSP_TOKEN_URL: ${{ secrets.DSP_TOKEN_URL }}
        run: |
          datasphere login --host "$DSP_HOST" \
            --client-id "$DSP_CLIENT_ID" --client-secret "$DSP_CLIENT_SECRET" \
            --authorization-url "$DSP_AUTH_URL" --token-url "$DSP_TOKEN_URL" \
            --authorization-flow client_credentials

      - name: Verify every object is present and readable
        env:
          MATRIX: ${{ needs.resolve.outputs.matrix }}
        run: |
          FAILED=0
          echo "## QA test results" >> "$GITHUB_STEP_SUMMARY"
          while read -r ITEM; do
            TYPE=$(echo "$ITEM" | jq -r .object_type)
            NAME=$(echo "$ITEM" | jq -r .technical_name)
            if datasphere objects "$TYPE" read --host "$DSP_HOST" --space "$SPACE" \
                 --technical-name "$NAME" > /tmp/after.json 2>/dev/null \
               && [ -s /tmp/after.json ] && jq empty /tmp/after.json 2>/dev/null; then
              echo "- PASS \`$TYPE/$NAME\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- FAIL \`$TYPE/$NAME\`" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::$TYPE/$NAME is not readable in QA."
              FAILED=1
            fi
          done < <(echo "$MATRIX" | jq -c '.include[]')
          exit $FAILED

  plan_prod:
    name: B4. Plan PROD change
    needs: [resolve, test_qa]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPACE: ${{ vars.PROD_SPACE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install -g @sap/datasphere-cli

      - name: Log in to Datasphere
        env:
          DSP_CLIENT_ID: ${{ secrets.DSP_GIT_INTEGRATE_CLIENT_ID }}
          DSP_CLIENT_SECRET: ${{ secrets.DSP_GIT_INTEGRATE_CLIENT_SECRET }}
          DSP_AUTH_URL: ${{ secrets.DSP_AUTH_URL }}
          DSP_TOKEN_URL: ${{ secrets.DSP_TOKEN_URL }}
        run: |
          datasphere login --host "$DSP_HOST" \
            --client-id "$DSP_CLIENT_ID" --client-secret "$DSP_CLIENT_SECRET" \
            --authorization-url "$DSP_AUTH_URL" --token-url "$DSP_TOKEN_URL" \
            --authorization-flow client_credentials

      - name: Diff live PROD against what is about to deploy
        env:
          MATRIX: ${{ needs.resolve.outputs.matrix }}
        run: |
          mkdir -p prod-snapshot
          echo "## PROD deployment plan" >> "$GITHUB_STEP_SUMMARY"
          echo "$MATRIX" | jq -c '.include[]' | while read -r ITEM; do
            TYPE=$(echo "$ITEM" | jq -r .object_type)
            NAME=$(echo "$ITEM" | jq -r .technical_name)
            TARGET="objects/$TYPE/$NAME.json"
            SNAP="prod-snapshot/${TYPE}__${NAME}.json"

            if datasphere objects "$TYPE" read --host "$DSP_HOST" --space "$SPACE" \
                 --technical-name "$NAME" > "$SNAP" 2>/dev/null && [ -s "$SNAP" ]; then
              jq --sort-keys . "$SNAP" > "$SNAP.n" && mv "$SNAP.n" "$SNAP"
              echo "### UPDATE \`$TYPE/$NAME\`" >> "$GITHUB_STEP_SUMMARY"
              echo '```diff' >> "$GITHUB_STEP_SUMMARY"
              diff -u "$SNAP" <(jq --sort-keys . "$TARGET") | head -n 120 >> "$GITHUB_STEP_SUMMARY" || true
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            else
              rm -f "$SNAP"
              echo "### CREATE \`$TYPE/$NAME\` - does not exist in PROD" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload rollback snapshot
        uses: actions/upload-artifact@v4
        with:
          name: prod-snapshot-${{ github.run_id }}
          path: prod-snapshot/
          retention-days: 30
          if-no-files-found: ignore

  deploy_prod:
    name: B5. PROD - ${{ matrix.object_type }}/${{ matrix.technical_name }}
    needs: [resolve, plan_prod]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    env:
      SPACE: ${{ vars.PROD_SPACE }}
      TYPE: ${{ matrix.object_type }}
      NAME: ${{ matrix.technical_name }}
    steps:
      - name: Refuse anything that is not on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::PROD deploys only from main. Current ref: ${{ github.ref }}"
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install -g @sap/datasphere-cli

      - name: Log in to Datasphere
        env:
          DSP_CLIENT_ID: ${{ secrets.DSP_GIT_INTEGRATE_CLIENT_ID }}
          DSP_CLIENT_SECRET: ${{ secrets.DSP_GIT_INTEGRATE_CLIENT_SECRET }}
          DSP_AUTH_URL: ${{ secrets.DSP_AUTH_URL }}
          DSP_TOKEN_URL: ${{ secrets.DSP_TOKEN_URL }}
        run: |
          datasphere login --host "$DSP_HOST" \
            --client-id "$DSP_CLIENT_ID" --client-secret "$DSP_CLIENT_SECRET" \
            --authorization-url "$DSP_AUTH_URL" --token-url "$DSP_TOKEN_URL" \
            --authorization-flow client_credentials

      - name: Snapshot current PROD object
        id: snap
        run: |
          if datasphere objects "$TYPE" read --host "$DSP_HOST" --space "$SPACE" \
               --technical-name "$NAME" > /tmp/backup.json 2>/dev/null && [ -s /tmp/backup.json ]; then
            echo "existed=true" >> "$GITHUB_OUTPUT"
          else
            echo "existed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to PROD
        run: |
          FILE="objects/$TYPE/$NAME.json"
          set +e
          if [ "${{ steps.snap.outputs.existed }}" = "true" ]; then
            datasphere objects "$TYPE" update --host "$DSP_HOST" --space "$SPACE" \
              --technical-name "$NAME" --file-path "$FILE" > /tmp/cli_out.log 2> /tmp/cli_err.log
          else
            datasphere objects "$TYPE" create --host "$DSP_HOST" --space "$SPACE" \
              --technical-name "$NAME" --file-path "$FILE" > /tmp/cli_out.log 2> /tmp/cli_err.log
          fi
          CLI_EXIT=$?
          set -e
          if [ $CLI_EXIT -ne 0 ]; then
            echo "::error::CLI exited $CLI_EXIT deploying $TYPE/$NAME to PROD ($SPACE)."
            echo "--- stdout ---"
            cat /tmp/cli_out.log
            echo "--- stderr ---"
            cat /tmp/cli_err.log
            exit 1
          fi
          cat /tmp/cli_out.log

      - name: Verify in PROD
        run: |
          datasphere objects "$TYPE" read --host "$DSP_HOST" --space "$SPACE" \
            --technical-name "$NAME" > /tmp/after.json
          if [ ! -s /tmp/after.json ] || ! jq empty /tmp/after.json 2>/dev/null; then
            echo "::error::$NAME is not readable in PROD after deployment."
            exit 1
          fi
          echo "- PROD OK \`$TYPE/$NAME\` at commit ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back on failure
        if: failure() && steps.snap.outputs.existed == 'true'
        run: |
          echo "::warning::Restoring the previous PROD definition of $TYPE/$NAME"
          datasphere objects "$TYPE" update --host "$DSP_HOST" --space "$SPACE" \
            --technical-name "$NAME" --file-path /tmp/backup.json

      - name: Warn about a partially created object
        if: failure() && steps.snap.outputs.existed == 'false'
        run: |
          echo "::warning::$TYPE/$NAME was newly created and may be half-deployed. Delete it manually if needed."
