name: Datasphere Export Only

# Exports a single object from a Datasphere space and commits/pushes it to this repo.
# Space ID is the first input; object type is a dropdown covering all major Datasphere object types.

on:
  workflow_dispatch:
    inputs:
      space:
        description: "Space ID to export from"
        required: true
      object_type:
        description: "Object type"
        required: true
        type: choice
        default: "local-tables"
        options:
          - local-tables
          - views
          - analytic-models
          - data-flows
          - transformation-flows
          - replication-flows
          - data-access-controls
          - task-chains
          - intelligent-lookups
      technical_name:
        description: "Technical name of the object"
        required: true

jobs:
  export:
    name: Export object from Datasphere -> Git
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Datasphere CLI
        run: npm install -g @sap/datasphere-cli

      - name: Log in to Datasphere (Technical User, headless)
        env:
          DSP_HOST: ${{ vars.DSP_HOST }}
          DSP_CLIENT_ID: ${{ secrets.DSP_GIT_INTEGRATE_CLIENT_ID }}
          DSP_CLIENT_SECRET: ${{ secrets.DSP_GIT_INTEGRATE_CLIENT_SECRET }}
          DSP_AUTH_URL: ${{ secrets.DSP_AUTH_URL }}
          DSP_TOKEN_URL: ${{ secrets.DSP_TOKEN_URL }}
        run: |
          datasphere login --host "$DSP_HOST" \
            --client-id "$DSP_CLIENT_ID" \
            --client-secret "$DSP_CLIENT_SECRET" \
            --authorization-url "$DSP_AUTH_URL" \
            --token-url "$DSP_TOKEN_URL" \
            --authorization-flow client_credentials

      - name: Export object
        env:
          DSP_HOST: ${{ vars.DSP_HOST }}
        run: |
          SPACE="${{ github.event.inputs.space }}"
          TYPE="${{ github.event.inputs.object_type }}"
          NAME="${{ github.event.inputs.technical_name }}"
          mkdir -p "objects/$TYPE"
          datasphere objects "$TYPE" read \
            --host "$DSP_HOST" \
            --space "$SPACE" \
            --technical-name "$NAME" \
            > "objects/$TYPE/$NAME.json"

      - name: Validate exported file is non-empty
        run: |
          TYPE="${{ github.event.inputs.object_type }}"
          NAME="${{ github.event.inputs.technical_name }}"
          FILE="objects/$TYPE/$NAME.json"
          if [ ! -s "$FILE" ]; then
            echo "::error::$FILE is empty - export likely failed (check space ID and technical name)."
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name "datasphere-ci-bot"
          git config user.email "ci-bot@example.com"
          git add objects
          git diff --cached --quiet && echo "No changes to commit" || \
            (git commit -m "Export ${{ github.event.inputs.technical_name }} (${{ github.event.inputs.object_type }}) from ${{ github.event.inputs.space }}" && \
             git push origin main)
