name: Datasphere Export / Import

# Two manual jobs:
#  - export: pulls objects from a Datasphere space and pushes them to this repo
#  - import: pulls the latest files from this repo and deploys them into a target space
#
# Both use client_credentials OAuth (no browser/passcode) so they can run headless on GitHub's runners.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "export (Datasphere -> Git) or import (Git -> Datasphere)"
        required: true
        default: "export"
        type: choice
        options: [export, import]
      object_type:
        description: "Object type folder, e.g. local-tables, view, data-flows"
        required: true
        default: "local-tables"
      technical_name:
        description: "Technical name of the object"
        required: true
      space:
        description: "Space ID (source for export, target for import)"
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Log in to Datasphere (client_credentials, headless)
        env:
          DSP_HOST: ${{ vars.DSP_HOST }}
          DSP_CLIENT_ID: ${{ secrets.DSP_CLIENT_ID }}
          DSP_CLIENT_SECRET: ${{ secrets.DSP_CLIENT_SECRET }}
          DSP_AUTH_URL: ${{ secrets.DSP_AUTH_URL }}
          DSP_TOKEN_URL: ${{ secrets.DSP_TOKEN_URL }}
        run: |
          npx datasphere login \
            --host "$DSP_HOST" \
            --client-id "$DSP_CLIENT_ID" \
            --client-secret "$DSP_CLIENT_SECRET" \
            --authorization-url "$DSP_AUTH_URL" \
            --token-url "$DSP_TOKEN_URL" \
            --authorization-flow client_credentials

      - name: Export object (Datasphere -> file)
        if: github.event.inputs.action == 'export'
        env:
          DSP_HOST: ${{ vars.DSP_HOST }}
        run: |
          TYPE="${{ github.event.inputs.object_type }}"
          NAME="${{ github.event.inputs.technical_name }}"
          SPACE="${{ github.event.inputs.space }}"
          mkdir -p "objects/$TYPE"
          npx datasphere objects "$TYPE" read \
            --host "$DSP_HOST" \
            --space "$SPACE" \
            --technical-name "$NAME" \
            > "objects/$TYPE/$NAME.json"

      - name: Commit and push exported file
        if: github.event.inputs.action == 'export'
        run: |
          git config user.name "datasphere-ci-bot"
          git config user.email "ci-bot@example.com"
          git add objects
          git diff --cached --quiet && echo "No changes to commit" || \
            (git commit -m "Export ${{ github.event.inputs.technical_name }} (${{ github.event.inputs.object_type }}) via GitHub Actions" && \
             git push origin main)

      - name: Deploy object (file -> Datasphere)
        if: github.event.inputs.action == 'import'
        env:
          DSP_HOST: ${{ vars.DSP_HOST }}
        run: |
          TYPE="${{ github.event.inputs.object_type }}"
          NAME="${{ github.event.inputs.technical_name }}"
          SPACE="${{ github.event.inputs.space }}"
          FILE="objects/$TYPE/$NAME.json"

          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE not found in repo. Did you check out the right branch?"
            exit 1
          fi

          EXISTS=$(npx datasphere objects "$TYPE" list --host "$DSP_HOST" --space "$SPACE" --select "technicalName" \
            | grep -c "\"$NAME\"" || true)

          if [ "$EXISTS" -gt 0 ]; then
            echo "Object exists in $SPACE, running update"
            npx datasphere objects "$TYPE" update --host "$DSP_HOST" --space "$SPACE" --technical-name "$NAME" --file-path "$FILE"
          else
            echo "Object not found in $SPACE, running create"
            npx datasphere objects "$TYPE" create --host "$DSP_HOST" --space "$SPACE" --technical-name "$NAME" --file-path "$FILE"
          fi
