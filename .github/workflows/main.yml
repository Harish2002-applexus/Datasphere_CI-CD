name: Datasphere Merge -> QA (approval) -> Test -> PROD (approval)

# Trigger: runs automatically whenever a Pull Request is merged into main
# (i.e. after User 1 and User 2's changes have been reconciled and merged via GitHub's PR flow).
#
# Stages:
#   1. deploy_qa   : requires manual approval (Environment "qa"), then deploys the merged file into QA
#   2. test_qa     : automated sanity check that the object exists/reads correctly in QA
#   3. deploy_prod : requires manual approval (Environment "production"), then deploys into PROD

on:
  push:
    branches: [main]
    paths:
      - "objects/**"
  workflow_dispatch:
    inputs:
      object_type:
        description: "e.g. local-tables, views, data-flows"
        required: true
        default: "local-tables"
      technical_name:
        description: "Technical name of the object"
        required: true

jobs:
  # Figures out which object/type changed in this push, so manual dispatch and
  # automatic push-triggered runs both work through the same downstream jobs.
  resolve_target:
    name: Resolve object to deploy
    runs-on: ubuntu-latest
    outputs:
      object_type: ${{ steps.set.outputs.object_type }}
      technical_name: ${{ steps.set.outputs.technical_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine changed object (push trigger) or use manual input
        id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "object_type=${{ github.event.inputs.object_type }}" >> "$GITHUB_OUTPUT"
            echo "technical_name=${{ github.event.inputs.technical_name }}" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- objects | head -n 1)
            TYPE=$(echo "$CHANGED" | cut -d'/' -f2)
            NAME=$(basename "$CHANGED" .json)
            echo "object_type=$TYPE" >> "$GITHUB_OUTPUT"
            echo "technical_name=$NAME" >> "$GITHUB_OUTPUT"
          fi

  deploy_qa:
    name: 1. Deploy to QA (approval required)
    needs: resolve_target
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Datasphere CLI
        run: npm install -g @sap/datasphere-cli

      - name: Log in to Datasphere
        env:
          DSP_HOST: ${{ vars.DSP_HOST }}
          DSP_CLIENT_ID: ${{ secrets.DSP_GIT_INTEGRATE_CLIENT_ID }}
          DSP_CLIENT_SECRET: ${{ secrets.DSP_GIT_INTEGRATE_CLIENT_SECRET }}
          DSP_AUTH_URL: ${{ secrets.DSP_AUTH_URL }}
          DSP_TOKEN_URL: ${{ secrets.DSP_TOKEN_URL }}
        run: |
          datasphere login --host "$DSP_HOST" \
            --client-id "$DSP_CLIENT_ID" \
            --client-secret "$DSP_CLIENT_SECRET" \
            --authorization-url "$DSP_AUTH_URL" \
            --token-url "$DSP_TOKEN_URL" \
            --authorization-flow client_credentials

      - name: Create or update object in QA
        env:
          DSP_HOST: ${{ vars.DSP_HOST }}
          QA_SPACE: ${{ vars.DSP_QA_SPACE }}
        run: |
          TYPE="${{ needs.resolve_target.outputs.object_type }}"
          NAME="${{ needs.resolve_target.outputs.technical_name }}"
          FILE="objects/$TYPE/$NAME.json"

          EXISTS=$(datasphere objects "$TYPE" list --host "$DSP_HOST" --space "$QA_SPACE" --select "technicalName" \
            | grep -c "\"$NAME\"" || true)

          if [ "$EXISTS" -gt 0 ]; then
            datasphere objects "$TYPE" update --host "$DSP_HOST" --space "$QA_SPACE" --technical-name "$NAME" --file-path "$FILE"
          else
            datasphere objects "$TYPE" create --host "$DSP_HOST" --space "$QA_SPACE" --technical-name "$NAME" --file-path "$FILE"
          fi

  test_qa:
    name: 2. Test in QA
    needs: [resolve_target, deploy_qa]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Datasphere CLI
        run: npm install -g @sap/datasphere-cli

      - name: Log in to Datasphere
        env:
          DSP_HOST: ${{ vars.DSP_HOST }}
          DSP_CLIENT_ID: ${{ secrets.DSP_GIT_INTEGRATE_CLIENT_ID }}
          DSP_CLIENT_SECRET: ${{ secrets.DSP_GIT_INTEGRATE_CLIENT_SECRET }}
          DSP_AUTH_URL: ${{ secrets.DSP_AUTH_URL }}
          DSP_TOKEN_URL: ${{ secrets.DSP_TOKEN_URL }}
        run: |
          datasphere login --host "$DSP_HOST" \
            --client-id "$DSP_CLIENT_ID" \
            --client-secret "$DSP_CLIENT_SECRET" \
            --authorization-url "$DSP_AUTH_URL" \
            --token-url "$DSP_TOKEN_URL" \
            --authorization-flow client_credentials

      - name: Verify object exists and is readable in QA
        env:
          DSP_HOST: ${{ vars.DSP_HOST }}
          QA_SPACE: ${{ vars.DSP_QA_SPACE }}
        run: |
          TYPE="${{ needs.resolve_target.outputs.object_type }}"
          NAME="${{ needs.resolve_target.outputs.technical_name }}"
          OUTPUT=$(datasphere objects "$TYPE" read --host "$DSP_HOST" --space "$QA_SPACE" --technical-name "$NAME")
          if [ -z "$OUTPUT" ]; then
            echo "::error::Object $NAME not readable in QA after deployment. Failing test stage."
            exit 1
          fi
          echo "QA test passed: $NAME is present and readable."
          # Extend this step with real validation logic as needed
          # (e.g. checking specific fields, row counts via a separate query tool, etc.)

  deploy_prod:
    name: 3. Deploy to PROD (approval required)
    needs: [resolve_target, test_qa]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Datasphere CLI
        run: npm install -g @sap/datasphere-cli

      - name: Log in to Datasphere
        env:
          DSP_HOST: ${{ vars.DSP_HOST }}
          DSP_CLIENT_ID: ${{ secrets.DSP_GIT_INTEGRATE_CLIENT_ID }}
          DSP_CLIENT_SECRET: ${{ secrets.DSP_GIT_INTEGRATE_CLIENT_SECRET }}
          DSP_AUTH_URL: ${{ secrets.DSP_AUTH_URL }}
          DSP_TOKEN_URL: ${{ secrets.DSP_TOKEN_URL }}
        run: |
          datasphere login --host "$DSP_HOST" \
            --client-id "$DSP_CLIENT_ID" \
            --client-secret "$DSP_CLIENT_SECRET" \
            --authorization-url "$DSP_AUTH_URL" \
            --token-url "$DSP_TOKEN_URL" \
            --authorization-flow client_credentials

      - name: Create or update object in PROD
        env:
          DSP_HOST: ${{ vars.DSP_HOST }}
          PROD_SPACE: ${{ vars.DSP_PROD_SPACE }}
        run: |
          TYPE="${{ needs.resolve_target.outputs.object_type }}"
          NAME="${{ needs.resolve_target.outputs.technical_name }}"
          FILE="objects/$TYPE/$NAME.json"

          EXISTS=$(datasphere objects "$TYPE" list --host "$DSP_HOST" --space "$PROD_SPACE" --select "technicalName" \
            | grep -c "\"$NAME\"" || true)

          if [ "$EXISTS" -gt 0 ]; then
            datasphere objects "$TYPE" update --host "$DSP_HOST" --space "$PROD_SPACE" --technical-name "$NAME" --file-path "$FILE"
          else
            datasphere objects "$TYPE" create --host "$DSP_HOST" --space "$PROD_SPACE" --technical-name "$NAME" --file-path "$FILE"
          fi
